services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/forecasts.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Use relative /api path since nginx proxies to backend
        VITE_API_BASE_URL: /api
    ports:
      - "3000:80"
    depends_on:
      - backend
